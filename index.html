        <div class="logo">
            <img src="https://via.placeholder.com/150x50?text=Rabat+Prints+Logo" alt="Rabat Prints Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#" data-key="home">Accueil</a></li>
                <li><a href="#" data-key="products">Produits</a></li>
                <li><a href="#" data-key="contact">Contact</a></li>
            </ul>
        </nav>
        <div class="lang-switch">
            <button id="lang-fr">FR</button>
            <button id="lang-ar">AR</button>
        </div>
    </header>
    <section class="hero">
        <h1 data-key="welcome">Bienvenue chez Rabat Prints</h1>
        <p data-key="hero-text">Découvrez nos designs uniques pour t-shirts, hoodies et pantalons.</p>
    </section>
    <section class="products">
        <h2 data-key="latest-designs">Derniers Designs</h2>
        <div class="product-grid">
            <div class="product">
                <img src="https://via.placeholder.com/300x300?text=T-Shirt" alt="T-shirt">
                <h3 data-key="tshirt">T-shirt</h3>
                <select class="size">
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>
                <select class="color">
                    <option>Noir</option>
                    <option>Blanc</option>
                    <option>Rouge</option>
                </select>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/300x300?text=Hoodie" alt="Hoodie">
                <h3 data-key="hoodie">Hoodie</h3>
                <select class="size">
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>
                <select class="color">
                    <option>Noir</option>
                    <option>Blanc</option>
                    <option>Rouge</option>
                </select>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/300x300?text=Pantalon" alt="Pantalon">
                <h3 data-key="pants">Pantalon</h3>
                <select class="size">
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>
                <select class="color">
                    <option>Noir</option>
                    <option>Blanc</option>
                    <option>Rouge</option>
                </select>
            </div>
        </div>
    </section>
    <section class="order-form">
        <h2 data-key="order">Commander</h2>
        <form id="orderForm">
            <input type="text" data-key="name" placeholder="Nom" required>
            <input type="tel" data-key="phone" placeholder="Téléphone" required>
            <textarea data-key="address" placeholder="Adresse" required></textarea>
            <select data-key="product-select">
                <option>T-shirt</option>
                <option>Hoodie</option>
                <option>Pantalon</option>
            </select>
            <select data-key="size-select">
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
            </select>
            <select data-key="color-select">
                <option>Noir</option>
                <option>Blanc</option>
                <option>Rouge</option>
            </select>
            <button type="submit" data-key="submit">Commander</button>
        </form>
    </section>

        <p data-key="footer">© 2023 Rabat Prints. Tous droits réservés.</p>
